<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Enrolled Courses & Registration</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="skills.html">Core Skills</a>
            <a href="courses.html" class="active">Courses & Registration</a>
            
        </nav>
    </header>

    <main class="container">
        <section>
            <h2>Current Semester Courses</h2>
            <table>
                <tr>
                    <th>Course Code</th>
                    <th>Course Name</th>
                    <th>Credits</th>
                </tr>
                <tr>
                    <td>CS101</td>
                    <td>Full Stack Development</td>
                    <td>4</td>
                </tr>
                <tr>
                    <td>CS102</td>
                    <td>Data Structures</td>
                    <td>3</td>
                </tr>
            </table>
        </section>

        <section>
            <h2>Course Registration Form</h2>
            <form>
                <fieldset>
                    <legend>Registration Details</legend>
                    
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" placeholder="Enter full name" required>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" placeholder="name@example.com" required>

                    <label for="course">Select Course:</label>
                    <select id="course">
                        <option value="">-- Choose a Course --</option>
                        <option value="fullstack">Full Stack Development</option>
                        <option value="ds">Data Structures</option>
                        <option value="dbms">Database Management Systems</option>
                    </select>

                    <button type="submit">Submit Registration</button>
                    <button type="reset" style="background-color: #7f8c8d;">Reset</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Portal | Skill Lab Module 1</p>
    </footer>
</body>
</html>
